<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Guide cursor</title>
  <desc id="desc">A high contrast pointer cursor with an animated orange tap ring.</desc>
  <style>
    .tap-ring {
      transform-origin: 25px 16.5px;
      animation: guide-tap-ring 1.55s ease-out infinite;
    }

    .tap-dot {
      transform-origin: 25px 16.5px;
      animation: guide-tap-dot 1.55s ease-in-out infinite;
    }

    @keyframes guide-tap-ring {
      0%, 22% {
        opacity: .85;
        transform: scale(.28);
      }

      78%, 100% {
        opacity: 0;
        transform: scale(1);
      }
    }

    @keyframes guide-tap-dot {
      0%, 100% {
        transform: scale(1);
      }

      28% {
        transform: scale(.72);
      }
    }
  </style>
  <circle class="tap-ring" cx="25" cy="16.5" r="22" fill="none" stroke="#f59e0b" stroke-width="5" />
  <circle class="tap-dot" cx="25" cy="16.5" r="6" fill="#f59e0b" />
  <path
    d="M18 6.5v61.6c0 3.8 4.5 5.8 7.4 3.3l13.5-11.9 8.4 19.4c1 2.4 3.8 3.5 6.2 2.5l8.1-3.5c2.4-1 3.5-3.8 2.5-6.2l-8.3-19.2 17.9-.8c3.9-.2 5.5-5.1 2.5-7.5L25.1 3.1C22.2.8 18 2.8 18 6.5Z"
    fill="#071a3a"
  />
  <path
    d="M25 16.5v42.1l11.9-10.5c1.7-1.5 4.4-.9 5.3 1.2l9.8 22.6 3.7-1.6-9.9-22.7c-.9-2 .5-4.3 2.7-4.4l15.8-.7L25 16.5Z"
    fill="#ffffff"
  />
  <path
    d="M25 16.5v42.1l11.9-10.5c1.7-1.5 4.4-.9 5.3 1.2l9.8 22.6 3.7-1.6-9.9-22.7c-.9-2 .5-4.3 2.7-4.4l15.8-.7L25 16.5Z"
    fill="none"
    stroke="#f8fafc"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
